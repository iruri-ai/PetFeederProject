<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>智能宠物喂食器控制面板</title>
    <script>
        // 切换自动投喂开关
        function toggleAutoFeed(state){
            fetch(`/auto_feed_switch/${state}`)
                .then(res => res.text())
                .then(msg => alert(msg));
        }

        // 手动投喂
        function manualFeed(){
            fetch("/feed_manual")
                .then(res => res.text())
                .then(msg => alert(msg));
        }

        // 云台控制
        function moveCamera(dir){
            fetch(`/camera_control/${dir}`)
                .then(res => res.text())
                .then(msg => console.log(msg));
        }

        // 拉取最新投喂记录
        function loadLogs(){
            fetch("/feed_logs")
                .then(res => res.json())
                .then(data => {
                    let logDiv = document.getElementById("logs");
                    logDiv.innerHTML = "";
                    data.forEach(item => {
                        logDiv.innerHTML += `<p>${item.start_time} - ${item.end_time} | ${item.feed_amount}g | ${item.detect_result}</p>`;
                    });
                });
        }

        setInterval(loadLogs, 5000); // 每5秒刷新日志
    </script>
</head>
<body>
    <h1>智能宠物喂食器控制面板</h1>

    <h2>自动投喂控制</h2>
    <button onclick="toggleAutoFeed('on')">开启自动投喂</button>
    <button onclick="toggleAutoFeed('off')">关闭自动投喂</button>

    <h2>手动投喂</h2>
    <button onclick="manualFeed()">立即投喂</button>

    <h2>摄像头云台控制</h2>
    <button onclick="moveCamera('up')">↑</button>
    <button onclick="moveCamera('down')">↓</button>
    <button onclick="moveCamera('left')">←</button>
    <button onclick="moveCamera('right')">→</button>

    <h2>最新投喂记录</h2>
    <div id="logs">
        <!-- 日志自动填充 -->
    </div>
</body>
</html>
